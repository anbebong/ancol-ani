<!DOCTYPE html>
<html lang="vi" data-theme="pixel">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thư viện public - ancol-ani sync</title>
</head>
<body class="min-h-screen bg-base-200">
<div class="max-w-2xl mx-auto px-4 py-8 flex flex-col gap-6">

  <div class="navbar bg-base-100 rounded-box shadow-sm px-5">
    <div class="flex-1"><span class="text-lg font-bold">Thư viện public</span></div>
    <a href="/" class="link link-primary link-hover text-sm font-semibold">← Tài khoản</a>
  </div>

  <!-- Chưa đăng nhập: không tải GIF nào cả -->
  <div id="need-login" class="card bg-base-100 shadow-sm hidden">
    <div class="card-body gap-3 items-center text-center">
      <p class="text-base-content/70">Bạn cần đăng nhập để xem thư viện công khai.</p>
      <a href="/" class="btn btn-primary btn-sm">Đăng nhập</a>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm" id="gallery-box">
    <div class="card-body gap-4">
      <h2 class="card-title text-sm uppercase tracking-wide text-base-content/70 flex items-center gap-1.5">
        <span data-icon="globe" class="w-4 h-4 [&>svg]:w-4 [&>svg]:h-4"></span>
        GIF được chia sẻ công khai
      </h2>
      <div class="flex gap-2 flex-wrap">
        <input type="text" id="search-q" placeholder="Tìm theo tên hoặc tag..." class="input input-bordered input-sm flex-1 min-w-[160px]"/>
        <input type="text" id="search-user" placeholder="Lọc theo người chia sẻ..." class="input input-bordered input-sm flex-1 min-w-[160px]"/>
      </div>
      <div id="grid" class="grid grid-cols-[repeat(auto-fill,minmax(120px,1fr))] gap-3"></div>
      <p class="text-base-content/60 text-sm hidden" id="empty-note">Chưa có GIF nào được chia sẻ công khai.</p>
    </div>
  </div>
</div>

<script type="module" src="/src/gallery.js"></script>
</body>
</html>
