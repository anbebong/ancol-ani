<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ancol-ani</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon"/>
</head>
<body class="min-h-screen flex justify-center p-4 sm:p-10">
<div class="w-full max-w-3xl flex flex-col gap-4">

  <div class="pixel-box flex items-center justify-between gap-3 p-4">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 sm:w-10 sm:h-10 flex-shrink-0 flex items-center justify-center border-2 border-[var(--border)] overflow-hidden" style="background: linear-gradient(135deg, var(--accent-1), var(--accent-2));">
        <img src="/favicon.ico" alt="ancol-ani" class="w-[22px] h-[22px] object-contain"/>
      </div>
      <div>
        <p class="text-base sm:text-sm font-bold tracking-wide">ANCOL-ANI</p>
        <p class="text-sm sm:text-xs mt-1 text-[var(--muted)]" data-i18n="subtitle"></p>
      </div>
    </div>
    <button id="lang-toggle" type="button" class="pixel-btn rounded-lg w-11 h-10 sm:w-10 sm:h-9 text-sm sm:text-xs font-semibold flex-shrink-0"></button>
  </div>

  <div class="pixel-box p-4">
    <div class="flex items-center gap-2 mb-3">
      <svg viewBox="0 0 24 24" fill="none" class="w-[14px] h-[14px] text-[var(--accent-1)] flex-shrink-0" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6h16M4 12h10M4 18h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h2 class="text-xs font-semibold uppercase tracking-wide text-[var(--muted)]" data-i18n="textLabel"></h2>
    </div>
    <form id="text-form" class="flex flex-col sm:flex-row gap-2">
      <input type="text" name="text" data-i18n-placeholder="textPlaceholder" autofocus
             class="pixel-input flex-1 min-w-0 w-full rounded-lg px-3 py-3 text-base sm:text-sm"/>
      <button type="submit" data-i18n="textSubmit"
              class="pixel-btn rounded-lg w-full sm:w-auto px-4 py-3 text-base sm:text-sm font-semibold whitespace-nowrap"></button>
    </form>
  </div>

  <div class="pixel-box p-4">
    <div class="flex items-center gap-2 mb-3">
      <svg viewBox="0 0 24 24" fill="none" class="w-[14px] h-[14px] text-[var(--accent-1)] flex-shrink-0" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" stroke="currentColor" stroke-width="2"/>
        <circle cx="8.5" cy="9" r="1.5" fill="currentColor"/>
        <path d="M21 15l-5-5-4 4-2-2-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2 class="text-xs font-semibold uppercase tracking-wide text-[var(--muted)]" data-i18n="gifLabel"></h2>
    </div>

    <div class="flex flex-col sm:flex-row items-center sm:items-start gap-4 text-center sm:text-left">
      <div class="w-24 h-24 sm:w-[72px] sm:h-[72px] flex-shrink-0 border-2 border-[var(--border)] bg-[var(--bg)] flex items-center justify-center overflow-hidden">
        <canvas id="preview" class="w-20 h-20 sm:w-14 sm:h-14 object-contain"></canvas>
      </div>

      <div class="w-full flex-1 min-w-0 flex flex-col gap-2.5">
        <form id="gif-form" enctype="multipart/form-data">
          <label id="dropzone" class="pixel-dropzone flex items-center gap-2.5 p-4 cursor-pointer">
            <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4 text-[var(--accent-1)] flex-shrink-0" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="flex-1 min-w-0 text-left">
              <div id="dropzone-name" class="text-sm sm:text-xs truncate" data-i18n="dropzoneDefault"></div>
              <div class="text-xs sm:text-[10px] mt-1 text-[var(--muted)]" data-i18n="dropzoneMax"></div>
            </div>
            <input type="file" name="gif" accept=".gif,image/gif" required class="hidden"/>
          </label>
          <button type="submit" data-i18n="uploadSubmit"
                  class="pixel-btn rounded-lg w-full mt-2.5 px-4 py-3 text-base sm:text-sm font-semibold"></button>
        </form>
        <form id="reset-form">
          <button type="submit" data-i18n="resetSubmit"
                  class="pixel-btn-ghost rounded-lg w-full px-4 py-3 text-base sm:text-sm font-semibold"></button>
        </form>
      </div>
    </div>
  </div>

  <div class="pixel-box p-4">
    <div class="flex items-center gap-2 mb-3">
      <svg viewBox="0 0 24 24" fill="none" class="w-[14px] h-[14px] text-[var(--accent-1)] flex-shrink-0" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2 class="text-xs font-semibold uppercase tracking-wide text-[var(--muted)]" data-i18n="syncLabel"></h2>
    </div>

    <!-- Chưa liên kết: chỉ hiện ô địa chỉ server + nút liên kết -->
    <div id="sync-unlinked" class="flex flex-col gap-2.5">
      <input type="text" id="sync-server-url" data-i18n-placeholder="syncServerPlaceholder"
             class="pixel-input w-full rounded-lg px-3 py-3 text-base sm:text-sm"/>
      <button id="sync-link-btn" type="button" data-i18n="syncLinkBtn"
              class="pixel-btn rounded-lg w-full px-4 py-3 text-base sm:text-sm font-semibold"></button>
    </div>

    <!-- Đã liên kết: chọn 1 GIF trong thư viện tài khoản để đồng bộ -->
    <div id="sync-linked" class="hidden flex-col gap-2.5">
      <p class="text-sm sm:text-xs text-[var(--muted)]">
        <span data-i18n="syncLinkedAs"></span> <span id="sync-username" class="font-semibold text-[var(--ink)]"></span>
      </p>
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-[var(--muted)] mb-2" data-i18n="syncPersonalLabel"></p>
        <div id="sync-library-personal" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2.5"></div>
        <p id="sync-library-personal-empty" class="hidden text-sm sm:text-xs text-[var(--muted)]" data-i18n="syncLibraryEmpty"></p>
      </div>

      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-[var(--muted)] mb-2" data-i18n="syncPublicLabel"></p>
        <div id="sync-library-public" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2.5"></div>
        <p id="sync-library-public-empty" class="hidden text-sm sm:text-xs text-[var(--muted)]" data-i18n="syncPublicEmpty"></p>
      </div>

      <button id="sync-unlink-btn" type="button" data-i18n="syncUnlinkBtn"
              class="pixel-btn-ghost rounded-lg w-full px-4 py-3 text-base sm:text-sm font-semibold"></button>
    </div>
  </div>

  <footer class="flex items-center justify-center gap-1.5 text-xs sm:text-[11px] text-[var(--muted)] py-2">
    <svg viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.9-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.33 1.11 2.9.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.84c.85 0 1.71.12 2.51.35 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.35 4.81-4.58 5.06.36.32.68.95.68 1.92 0 1.39-.01 2.5-.01 2.84 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"/>
    </svg>
    <span>anbebong</span>
    <span class="mx-1">·</span>
    <span id="app-version">v...</span>
  </footer>
</div>

<div id="toast"
     class="fixed left-2.5 right-2.5 sm:left-1/2 sm:right-auto bottom-4 sm:bottom-6 sm:-translate-x-1/2 translate-y-2 opacity-0 pointer-events-none transition-all duration-200 pixel-box px-4 py-2.5 text-sm sm:text-xs text-center"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
