<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ancol-ani</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #text-panel {
            width: 70px;
            height: 30px;
            flex: 0 0 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font: bold 11px sans-serif;
            color: #e02424;
            -webkit-text-stroke: 1px #fff066;
            paint-order: stroke fill;
            word-break: break-word;
            line-height: 1.1;
        }
        #stage {
            width: 70px;
            height: 70px;
            flex: 0 0 70px;
            object-fit: contain;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>
<div id="text-panel">Hi!</div>
<canvas id="stage"></canvas>
<script type="module">
    import { playGif } from './src/gifPlayer.js';

    window.runtime.EventsOn('server-text', (text) => {
        document.getElementById('text-panel').textContent = text;
    });

    const canvas = document.getElementById('stage');
    let stopCurrent = null;

    function reload() {
        if (stopCurrent) stopCurrent();
        stopCurrent = playGif(canvas, 'http://localhost:8788/gif?t=' + Date.now());
    }

    window.runtime.EventsOn('gif-changed', reload);
    reload();
</script>
</body>
</html>
