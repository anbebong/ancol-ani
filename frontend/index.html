<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ancol-ani</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Text sits in a small speech bubble in the brand colors (dark
           panel, white text, purple border) so it stays readable on any
           desktop wallpaper - the old red text with a yellow outline was
           hard to read on both light and dark backgrounds. The panel is
           only 30px tall: up to 2 lines of 10px text + the tail. A single
           entered line too long to fit those 2 lines is auto-split into
           several rotated messages instead of being cut off - see
           splitToFit() below. */
        #text-panel {
            width: 70px;
            height: 30px;
            flex: 0 0 30px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        #text-bubble {
            position: relative;
            box-sizing: border-box;
            max-width: 68px;
            margin-bottom: 3px;
            padding: 1px 4px;
            background: rgba(20, 20, 43, 0.92);
            color: #ffffff;
            border: 1.5px solid #8b73ff;
            border-radius: 6px;
            box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.45);
        }
        #text-bubble.is-empty { display: none; }
        /* .fx-fade/.fx-bounce/.fx-shake (applied to #text-content for as
           long as the current text is shown - see renderText below) come
           from ../ui/text-effects.css, imported in the module script below.
           "typewriter" has no CSS class: it's driven by a JS loop instead
           that retypes the text on a timer. */
        #text-bubble::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -4.5px;
            transform: translateX(-50%);
            border: 3.5px solid transparent;
            border-bottom: 0;
            border-top-color: #8b73ff;
        }
        #text-content {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font: 700 10px/1.1 "Segoe UI", system-ui, sans-serif;
            text-align: center;
            word-break: break-word;
        }
        #stage-wrap {
            position: relative;
            width: 70px;
            height: 70px;
            flex: 0 0 70px;
        }
        #stage {
            width: 70px;
            height: 70px;
            object-fit: contain;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            cursor: pointer;
        }
        /* Right-click overlay: two small buttons stacked over the GIF
           (the widget window is only 70x100px, too small for a menu to
           pop out past its own bounds). Hidden until contextmenu fires. */
        #menu-overlay {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            gap: 2px;
            padding: 4px;
            background: rgba(20, 20, 43, 0.85);
            border-radius: 4px;
        }
        #menu-overlay.is-open { display: flex; }
        #menu-overlay button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font: 700 9px/1.2 "Segoe UI", system-ui, sans-serif;
            color: #ffffff;
            /* Solid, saturated purple instead of the old #8b73ff (too close
               to the overlay's own dark-purple backdrop to stand out). */
            background: #5c3eeb;
            border: none;
            border-radius: 4px;
            padding: 3px 2px;
            cursor: pointer;
        }
        .menu-icon { display: inline-flex; width: 10px; height: 10px; flex: none; }
        .menu-icon svg { width: 100%; height: 100%; }
        #menu-overlay button:hover { background: #7a5cf5; }
        #menu-overlay button.cancel { background: #3a3a5c; }
        #menu-overlay button.cancel:hover { background: #4d4d78; }
    </style>
</head>
<body>
<div id="text-panel"><div id="text-bubble"><span id="text-content">Ancol Hello</span></div></div>
<div id="stage-wrap">
    <canvas id="stage"></canvas>
    <div id="menu-overlay">
        <button id="menu-settings" type="button"><span id="menu-settings-icon" class="menu-icon"></span>Cài đặt</button>
        <button id="menu-cancel" class="cancel" type="button"><span id="menu-cancel-icon" class="menu-icon"></span>Hủy</button>
    </div>
</div>
<script type="module">
    import { playGif } from './src/gifPlayer.js';
    import { splitToFit, makeFitsWithinLines, contentWidthOf } from '../ui/text-fit.js';
    import '../ui/text-effects.css';
    import settingsIcon from 'lucide-static/icons/settings.svg?raw';
    import xIcon from 'lucide-static/icons/x.svg?raw';

    document.getElementById('menu-settings-icon').innerHTML = settingsIcon;
    document.getElementById('menu-cancel-icon').innerHTML = xIcon;

    // Current display style (color + entrance effect + seconds per line), set
    // via the /text/style config endpoint.
    let textColor = '#ffffff';
    let textEffect = 'none';
    let textInterval = 4;

    // The text may hold several lines (one message each): they are shown one
    // after another, each for textInterval seconds, the entrance effect
    // replaying on every change, then it starts over. A single line behaves
    // as before (static, or typed out again and again for "typewriter").
    const TYPE_MS = 40;
    const HOLD_MS = 1500; // pause before retyping a single typewriter line
    let lines = [];
    let lineIdx = 0;
    let typeTimer = null;
    let rotateTimer = null;

    function stopTimers() {
        clearInterval(typeTimer);
        clearTimeout(typeTimer);
        clearTimeout(rotateTimer);
    }

    function applyStyle(style) {
        if (!style) return;
        if (style.color) textColor = style.color;
        if (style.effect) textEffect = style.effect;
        if (style.interval) textInterval = Number(style.interval) || textInterval;
        document.getElementById('text-content').style.color = textColor;
    }

    function showCurrentLine() {
        stopTimers();
        const el = document.getElementById('text-content');
        el.classList.remove('fx-fade', 'fx-bounce', 'fx-shake');
        if (!lines.length) { el.textContent = ''; return; }

        const value = lines[lineIdx];
        const multi = lines.length > 1;
        const next = () => { lineIdx = (lineIdx + 1) % lines.length; showCurrentLine(); };

        if (textEffect === 'typewriter') {
            let i = 0;
            el.textContent = '';
            typeTimer = setInterval(() => {
                i++;
                el.textContent = value.slice(0, i);
                if (i >= value.length) {
                    clearInterval(typeTimer);
                    // several lines: hold, then the next one; one line: hold, retype it
                    typeTimer = setTimeout(multi ? next : showCurrentLine, multi ? textInterval * 1000 : HOLD_MS);
                }
            }, TYPE_MS);
            return;
        }

        el.textContent = value;
        if (textEffect !== 'none') {
            // Force a reflow so the animation replays even if the same
            // effect class was already applied (e.g. the same text is re-set).
            void el.offsetWidth;
            el.classList.add('fx-' + textEffect);
        }
        if (multi) rotateTimer = setTimeout(next, textInterval * 1000);
    }

    // Canvas-measured fit check (see ui/text-fit.js) - width/font copied
    // from #text-bubble/#text-content's actual computed style at runtime
    // (never hardcoded), so it can't drift out of sync with the CSS above.
    const bubbleStyle = getComputedStyle(document.getElementById('text-bubble'));
    const contentStyle = getComputedStyle(document.getElementById('text-content'));
    const contentWidthPx = contentWidthOf(bubbleStyle);
    const fontCss = `${contentStyle.fontWeight} ${contentStyle.fontSize} ${contentStyle.fontFamily}`;
    const fitsTwoLines = makeFitsWithinLines(fontCss, contentWidthPx, 2); // 2 = the bubble's -webkit-line-clamp

    function setText(text) {
        // A single line the user typed may be too long for the 2-line
        // bubble. Instead of silently clamping it with an ellipsis, split
        // it into several chunks - each becomes its own rotated message,
        // same as if the user had pressed Enter between them.
        const entered = (text || '').split('\n').map((l) => l.trim()).filter(Boolean);
        lines = entered.flatMap((l) => splitToFit(l, fitsTwoLines));
        lineIdx = 0;
        // No bubble at all for empty text instead of an empty box.
        document.getElementById('text-bubble').classList.toggle('is-empty', !lines.length);
        showCurrentLine();
    }

    // A style change (effect / seconds per line) restarts the current line
    // so it takes effect right away.
    function onStyle(style) {
        applyStyle(style);
        showCurrentLine();
    }

    window.runtime.EventsOn('server-text', setText);
    window.runtime.EventsOn('server-text-style', onStyle);

    // This page is served by Wails on its own origin, not by the Go local
    // server, so fetches to it need an absolute URL. The port comes from
    // Go (app.go's LocalPort, bound via main.go) instead of being
    // hardcoded here too - change clientLocalPort in one place.
    const base = 'http://localhost:' + await window.go.main.App.LocalPort();

    // GET /text and /text/style persist across restarts (app.go), so load
    // whatever was last set instead of always showing the hardcoded
    // default above. Style first, so the first render already uses it.
    await fetch(base + '/text/style', { cache: 'no-store' }).then((r) => r.json()).then(applyStyle).catch(() => {});
    fetch(base + '/text', { cache: 'no-store' }).then((r) => r.text()).then(setText).catch(() => {});

    const canvas = document.getElementById('stage');
    let stopCurrent = null;

    function reload() {
        if (stopCurrent) stopCurrent();
        stopCurrent = playGif(canvas, base + '/gif?t=' + Date.now());
    }

    window.runtime.EventsOn('gif-changed', reload);
    reload();

    // Right-clicking the widget shows "Cài đặt" / "Hủy" as an HTML overlay
    // drawn over the GIF itself, instead of a native OS menu - the widget
    // window is only 70x100px, so a real popup menu would try to draw
    // outside it and get clipped. The widget itself is no longer
    // click-through (see makeClickThrough). Left-click does nothing.
    const menuOverlay = document.getElementById('menu-overlay');

    document.body.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        menuOverlay.classList.add('is-open');
    });

    document.getElementById('menu-settings').addEventListener('click', () => {
        menuOverlay.classList.remove('is-open');
        window.go.main.App.OpenSettings();
    });
    document.getElementById('menu-cancel').addEventListener('click', () => {
        menuOverlay.classList.remove('is-open');
    });
</script>
</body>
</html>
